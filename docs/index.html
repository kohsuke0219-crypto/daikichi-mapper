<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>買取大吉 商圏マップ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    /* ---- 凡例 ---- */
    .legend {
      background: rgba(255,255,255,0.92);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      line-height: 1.7;
      font-size: 12px;
      max-width: 200px;
    }
    .legend h4 { margin-bottom: 4px; font-size: 12px; font-weight: bold; }
    .legend i {
      display: inline-block;
      width: 13px; height: 13px;
      margin-right: 5px;
      vertical-align: middle;
      border-radius: 2px;
    }
    .legend .sep { border-top: 1px solid #ddd; margin: 6px 0; }
    .legend .dot {
      display: inline-block; width: 11px; height: 11px;
      border-radius: 50%; margin-right: 5px; vertical-align: middle;
      border: 1.5px solid #fff; box-shadow: 0 0 0 1px #999;
    }
    .legend .line {
      display: inline-block; width: 18px; height: 3px;
      margin-right: 5px; vertical-align: middle; border-radius: 2px;
    }
    /* 凡例: ▲三角 / ■四角スウォッチ */
    .legend .tri {
      display: inline-block; width: 0; height: 0; margin-right: 5px;
      vertical-align: middle;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-bottom: 11px solid #000;
      filter: drop-shadow(0 0 0.5px #999);
    }
    .legend .sq {
      display: inline-block; width: 11px; height: 11px; margin-right: 5px;
      vertical-align: middle; border-radius: 1px; box-shadow: 0 0 0 1px #fff inset;
    }
    /* 形状ピン（divIcon）の枠を透明に */
    .shape-pin { background: transparent !important; border: none !important; }
    .shape-pin svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
    /* ---- 凡例の折りたたみ ---- */
    .legend-header {
      font-weight: bold; font-size: 12px; cursor: pointer;
      user-select: none; display: flex; align-items: center;
      justify-content: space-between; gap: 10px;
    }
    .legend-toggle { font-size: 11px; color: #666; }
    /* ---- 出店候補ランキングピン ---- */
    .rank-pin-wrap { background: transparent !important; border: none !important; }
    .rank-pin {
      border-radius: 50%; color: #fff; font-weight: bold; text-align: center;
      border: 2.5px solid #fff;
      box-shadow: 0 2px 7px rgba(0,0,0,.55);
      font-family: Arial, sans-serif;
    }
    .rank-pin.top1 { border-width: 3px; box-shadow: 0 0 0 2px #FFD700, 0 3px 9px rgba(0,0,0,.6); }
    .rank-crown {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      font-size: 17px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4));
    }
    .legend .legend-body { margin-top: 6px; }
    .legend.collapsed .legend-body { display: none; }
    .legend.collapsed { padding: 6px 12px; }
    /* ---- 小画面向け調整 ---- */
    @media (max-width: 768px) {
      .legend { max-width: 150px; font-size: 11px; max-height: 55vh; overflow: auto; }
      .info   { max-width: 170px; font-size: 11px; min-width: 120px; }
      #choropleth-select { font-size: 12px; padding: 4px 6px; }
    }

    /* ---- コロプレス切替セレクタ ---- */
    #choropleth-select {
      position: absolute; top: 10px; left: 55px; z-index: 800;
      background: rgba(255,255,255,0.93);
      border: 1px solid #ccc; border-radius: 6px;
      padding: 5px 8px; font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
      cursor: pointer;
    }

    /* ---- Info box ---- */
    .info {
      background: rgba(255,255,255,0.95);
      padding: 8px 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      font-size: 12px; min-width: 180px; max-width: 240px;
    }
    .info h4 { margin-bottom: 4px; font-size: 13px; }

    /* ---- ローディング ---- */
    #loading {
      position: fixed; inset: 0;
      background: rgba(255,255,255,.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 16px; z-index: 9999;
    }
    #loading-sub { font-size: 12px; color: #666; margin-top: 8px; }
    #bg-status {
      position: fixed; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.55); color: #fff;
      padding: 4px 12px; border-radius: 12px;
      font-size: 11px; z-index: 700; display: none;
    }

    /* ---- 機能1/3: ツールパネル（半径集計 + お気に入り） ---- */
    .toolpanel {
      background: rgba(255,255,255,0.95);
      padding: 8px 10px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      font-size: 12px; width: 230px; max-width: 70vw;
    }
    .toolpanel h4 { font-size: 12px; margin: 6px 0 3px; }
    .toolpanel .sep { border-top: 1px solid #ddd; margin: 7px 0; }
    .toolpanel-header {
      font-weight: bold; cursor: pointer; user-select: none;
      display: flex; align-items: center; justify-content: space-between;
    }
    .toolpanel.collapsed .toolpanel-body { display: none; }
    .toolpanel.collapsed { width: auto; }
    .tp-modes label { display: block; cursor: pointer; line-height: 1.6; }
    .tp-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    .tp-row input[type=range] { flex: 1; }
    #measure-result {
      background: #f0f9ff; border: 1px solid #bae6fd;
      border-radius: 5px; padding: 5px 7px; margin: 5px 0; line-height: 1.45;
    }
    .tp-btn {
      border: none; border-radius: 5px; padding: 4px 9px;
      font-size: 11px; cursor: pointer; color: #fff;
    }
    #fav-list { max-height: 26vh; overflow: auto; margin-top: 4px; }
    .fav-item {
      display: flex; align-items: flex-start; gap: 5px;
      padding: 4px 4px; border-radius: 4px; cursor: pointer; line-height: 1.35;
    }
    .fav-item:hover { background: #f3e8ff; }
    .fav-item .fav-star { color: #6D28D9; flex: 0 0 auto; }
    .fav-item .fav-text { word-break: break-word; }
    /* ---- 機能3: お気に入り星ピン（最前面ペイン） ---- */
    .fav-pin-wrap { background: transparent !important; border: none !important; }
    .fav-pin {
      color: #6D28D9; font-size: 26px; line-height: 26px; text-align: center;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff, 0 1px 2px rgba(0,0,0,.5);
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .toolpanel { width: 175px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="loading">地図を読み込み中…<div id="loading-sub"></div></div>
  <div id="map"></div>
  <select id="choropleth-select" title="コロプレス表示切替">
    <option value="pop">👥 女性40歳以上人口</option>
    <option value="none">（非表示）</option>
  </select>
  <div id="bg-status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
  <script>
  // ============================================================
  // 色スケール
  // ============================================================
  const POP_BREAKS  = [0,10000,30000,60000,100000,150000,200000];
  const POP_PAL     = ['#ffffb2','#fed976','#feb24c','#fd8d3c','#fc4e2a','#e31a1c','#800026'];

  function pickColor(breaks, pal, v) {
    for (let i = breaks.length-1; i >= 0; i--)
      if (v >= breaks[i]) return pal[i];
    return pal[0];
  }

  const PREF_COLORS = {
    '東京都':'#e74c3c','神奈川県':'#3498db','埼玉県':'#2ecc71','千葉県':'#f39c12','茨城県':'#795548',
    '栃木県':'#34495e','群馬県':'#d35400','静岡県':'#00838f'
  };
  const BRAND_COLORS = {
    'おたからや':'#9b59b6','バイセル':'#f1c40f','なんぼや':'#1abc9c'
  };
  // 生活動線（スーパー・複合施設）= マゼンタ / 新規オープン予定 = 金/琥珀
  const LIFELINE_COLOR = '#DB2777';
  const NEWOPEN_COLOR  = '#D4A017';
  // 出店候補ランキング: 戦略①=濃ブルー / 戦略②=濃グリーン
  const RANK1_COLOR = '#1D4ED8';
  const RANK2_COLOR = '#047857';

  // ----- 機能1: クリック地点 半径n km圏内 人口集計 -----
  // 集計指標は「40歳以上女性人口(women_40plus)」= マップのコロプレス指標と一致。
  const MEASURE_RADIUS_DEFAULT_KM = 1.5;  // 初期半径
  const MEASURE_RADIUS_MIN_KM     = 0.5;
  const MEASURE_RADIUS_MAX_KM     = 3.0;
  const MEASURE_RADIUS_STEP_KM    = 0.1;
  const MEASURE_CIRCLE_COLOR      = '#0EA5E9';  // 半透明の集計円（既存色と別）

  // ----- 機能2: 女性向け生活動線施設（5チェーン1色） -----
  const WOMEN_LIFELINE_COLOR  = '#0891B2';  // ティール系（既存色と非重複）
  const WOMEN_LIFELINE_CHAINS = ['カーブス','LAVA','カルド','ユザワヤ','トーカイ'];

  // ----- 機能3: お気に入り地点（localStorage保存） -----
  const FAV_STORAGE_KEY = 'daikichi_favorites_v1';  // localStorage キー
  const FAV_COLOR       = '#6D28D9';                // お気に入りピン色（星マーク・既存色と非重複）

  const fmtN = n => (n||0).toLocaleString('ja-JP');
  const escapeHtml = s => String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  // 2点間の距離(km) — haversine
  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371, toR = Math.PI/180;
    const dLat = (lat2-lat1)*toR, dLng = (lng2-lng1)*toR;
    const a = Math.sin(dLat/2)**2
            + Math.cos(lat1*toR)*Math.cos(lat2*toR)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }

  // 座標から Googleマップ / ストリートビュー へのリンクHTMLを生成
  const mapsLinks = (lat, lng) =>
    `<div style="margin-top:6px;font-size:12px">`
    + `<a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" `
    + `target="_blank" rel="noopener" style="color:#1a73e8;font-weight:bold">📍 Googleマップ</a>`
    + ` ｜ `
    + `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}" `
    + `target="_blank" rel="noopener" style="color:#1a73e8;font-weight:bold">🚶 ストリートビュー</a>`
    + `</div>`;

  // 機能3: ポップアップ内「お気に入り登録」ボタン（既存候補地点をそのまま登録）
  const favLinkHtml = (lat, lng) =>
    `<div style="margin-top:5px">`
    + `<button onclick="favAddFromPoint(${lat},${lng})" `
    + `style="background:${FAV_COLOR};color:#fff;border:none;border-radius:4px;`
    + `padding:3px 9px;font-size:11px;cursor:pointer">★ お気に入り登録</button></div>`;

  // 出店候補ランキング: 番号入りdivIconを生成（1位は王冠＋大きめ）
  function rankIcon(rank, color) {
    const top = rank === 1;
    const size = top ? 40 : 30;
    const crown = top ? '<div class="rank-crown">👑</div>' : '';
    return L.divIcon({
      className: 'rank-pin-wrap',
      html: crown + `<div class="rank-pin${top ? ' top1' : ''}" `
          + `style="background:${color};width:${size}px;height:${size}px;`
          + `line-height:${size - 5}px;font-size:${top ? 18 : 14}px;">${rank}</div>`,
      iconSize: [size, size], iconAnchor: [size/2, size/2],
    });
  }

  // 形状ピン（divIcon）: ▲三角 / ■四角（白縁・影付きで人口塗りの上でも視認）
  function triIcon(color, size) {
    const w = size, h = Math.round(size * 0.9);
    return L.divIcon({
      className: 'shape-pin',
      html: `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
          + `<polygon points="${w/2},1 ${w-1},${h-1} 1,${h-1}" fill="${color}" stroke="#fff" stroke-width="1.2"/></svg>`,
      iconSize: [w, h], iconAnchor: [w/2, h/2], popupAnchor: [0, -h/2],
    });
  }
  function sqIcon(color, size) {
    const s = size;
    return L.divIcon({
      className: 'shape-pin',
      html: `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">`
          + `<rect x="1" y="1" width="${s-2}" height="${s-2}" fill="${color}" stroke="#fff" stroke-width="1.2"/></svg>`,
      iconSize: [s, s], iconAnchor: [s/2, s/2], popupAnchor: [0, -s/2],
    });
  }

  // ランキングピンのポップアップHTML（スコア内訳・需要内訳・最寄り競合・商圏人口・近接スーパー）
  function rankPopup(r, strat) {
    const m = r.metrics, dd = r.demand_detail;
    const head = strat === 1 ? '出店候補 戦略①' : '出店候補 戦略②';
    const hcol = strat === 1 ? RANK1_COLOR : RANK2_COLOR;
    let h = `<div style="font-size:12px;min-width:210px">`;
    h += `<div style="color:${hcol};font-weight:bold">${head}　[${r.area_type}] 第${r.rank}位</div>`;
    h += `<b>${r.name}</b><br><span style="color:#555">${r.chain}・${r.category}</span><br>`;
    h += `${r.prefecture}${r.city}<br>`;
    h += `<div style="margin:4px 0;font-weight:bold">総合スコア: <span style="color:${hcol};font-size:14px">${r.total_score}</span> /100</div>`;
    h += `<table style="font-size:11px;border-collapse:collapse">`;
    const rows = [
      ['スーパー近接', m.super_proximity], ['競合の少なさ', m.competitor_scarcity],
      ['40歳以上女性人口', m.women_pop], ['カニバリ回避', m.cannibal_avoid],
      ['ロードサイド適性', m.roadside], ['需要の裏付け(複合)', m.demand_backing],
    ];
    rows.forEach(([k,v]) => { h += `<tr><td style="padding:0 6px 0 0">${k}</td><td><b>${v}</b>/10</td></tr>`; });
    h += `</table>`;
    h += `<div style="margin-top:4px;border-top:1px solid #ddd;padding-top:3px">`;
    h += `需要内訳: 漁業${dd['漁業']} / 製造業${dd['製造業']} / 農業${dd['農業']} / 商業${dd['商業']}<br>`;
    h += `<b>効いた裏付け: ${dd.top_source}</b>`;
    if (strat === 2 && r.dead_ocean) h += ` <span style="color:#c0392b">⚠デッドオーシャン懸念</span>`;
    h += `</div>`;
    h += `<div style="margin-top:3px">最寄り競合: ${r.nearest_comp_km}km（2km内${r.n_comp_2km}店）<br>`;
    h += `<b>推定商圏(メッシュ・半径2km/女性40+): ${fmtN(r.trade_women)}人</b><br>`;
    h += `<span style="color:#777">市区町村: 総人口 ${fmtN(r.muni_pop)}人 / 女性40+ ${fmtN(r.muni_women_40plus)}人</span>`;
    if (r.pop_sparse) h += `<br><span style="color:#c0392b">⚠周辺人口希薄（市は大きいが商圏内は薄い）</span>`;
    h += `<br>`;
    if (r.near_super_names && r.near_super_names.length)
      h += `近接スーパー: ${r.near_super_names.slice(0,3).join('、')}`;
    h += `</div>${mapsLinks(r.lat, r.lng)}${favLinkHtml(r.lat, r.lng)}</div>`;
    return h;
  }

  // ============================================================
  // 地図初期化
  // ============================================================
  // 1都7県（茨城/栃木/群馬/静岡含む）が初期表示で収まるよう中心・ズーム8に
  const map = L.map('map', { preferCanvas: true }).setView([35.85, 139.20], 8);

  // 買取大吉店舗ピン専用ペイン（最前面・SVGレンダラー）
  map.createPane('stores');
  map.getPane('stores').style.zIndex = 650;
  const storeRenderer = L.svg({ pane: 'stores' });

  // 出店候補ランキングピン専用ペイン（全ピン中で最前面・人口色塗りに埋もれない）
  map.createPane('ranking');
  map.getPane('ranking').style.zIndex = 700;

  // 機能1: 半径集計の円ペイン（コロプレス400より上・店舗ピン650より下＝ピンが円の上に見える）
  map.createPane('measure');
  map.getPane('measure').style.zIndex = 640;
  // 円はCanvasで全面を覆うため、ペインをpointer-events:noneにして
  // 下のコロプレスへのホバー/クリックを遮らないようにする（円はinteractive:false）
  map.getPane('measure').style.pointerEvents = 'none';

  // 機能3: お気に入り星ピン専用ペイン（全レイヤー中で最前面・必ず埋もれない）
  map.createPane('favorites');
  map.getPane('favorites').style.zIndex = 750;

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18,
  }).addTo(map);

  // ============================================================
  // 地名検索（入力した地名へ地図を移動）
  // ============================================================
  if (L.Control && L.Control.Geocoder) {
    L.Control.geocoder({
      position: 'topright',
      placeholder: '地名で検索…',
      errorMessage: '見つかりませんでした',
      defaultMarkGeocode: false,
      geocoder: L.Control.Geocoder.nominatim({
        geocodingQueryParams: { countrycodes: 'jp', 'accept-language': 'ja', limit: 5 },
      }),
    }).on('markgeocode', function (e) {
      map.flyTo(e.geocode.center, 14);
    }).addTo(map);
  }

  // ============================================================
  // ホバー情報ボックス
  // ============================================================
  const info = L.control({ position: 'topright' });
  info.onAdd = function() {
    this._div = L.DomUtil.create('div','info');
    this.clear(); return this._div;
  };
  info.clear = function() {
    this._div.innerHTML = '<h4>市区町村を選択</h4>ホバーで詳細表示';
  };
  info.show = function(p) {
    const tp = p.total_pop||0, wp = p.women_40plus||0;
    const pct = tp>0 ? (wp/tp*100).toFixed(1) : '—';
    this._div.innerHTML =
      `<h4>${p.city}</h4>総人口: ${fmtN(tp)}人<br>女性40+: <b>${fmtN(wp)}</b>人 (${pct}%)`;
  };
  info.addTo(map);

  // ============================================================
  // 凡例
  // ============================================================
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function() {
    this._div = L.DomUtil.create('div','legend');
    this._div.innerHTML =
      '<div class="legend-header"><span>凡例</span><span class="legend-toggle">▼</span></div>'
      + '<div class="legend-body"></div>';
    this._body = this._div.querySelector('.legend-body');
    const tog = this._div.querySelector('.legend-toggle');
    const hdr = this._div.querySelector('.legend-header');
    L.DomEvent.on(hdr, 'click', () => {
      const collapsed = this._div.classList.toggle('collapsed');
      tog.textContent = collapsed ? '▶' : '▼';
    });
    // 凡例操作で地図がドラッグ/ズームされないようにする
    L.DomEvent.disableClickPropagation(this._div);
    L.DomEvent.disableScrollPropagation(this._div);
    // 小画面では初期状態を折りたたみに
    if (window.innerWidth < 768) {
      this._div.classList.add('collapsed');
      tog.textContent = '▶';
    }
    return this._div;
  };
  legend.update = function(mode, showComp, showLifeline, showNewOpen, showRank1, showRank2,
                           showWomenLifeline, showFav) {
    let h = '';
    if (mode==='pop') {
      h += '<h4>女性40歳以上人口</h4>';
      POP_BREAKS.forEach((lo,i) => {
        const hi = i+1<POP_BREAKS.length ? (POP_BREAKS[i+1]-1).toLocaleString('ja-JP') : '';
        h += `<i style="background:${POP_PAL[i]}"></i>${lo.toLocaleString('ja-JP')}${hi?'–'+hi:'以上'}<br>`;
      });
    }
    h += (h?'<div class="sep"></div>':'') + '<h4>買取大吉</h4>';
    for (const [k,v] of Object.entries(PREF_COLORS))
      h += `<span class="dot" style="background:${v};border-color:${v}"></span>${k}<br>`;
    if (showComp) {
      h += '<div class="sep"></div><h4>競合店</h4>';
      for (const [k,v] of Object.entries(BRAND_COLORS))
        h += `<span class="dot" style="background:${v};border-color:${v}"></span>${k}<br>`;
    }
    if (showLifeline || showNewOpen) {
      h += '<div class="sep"></div>';
      if (showLifeline)
        h += `<h4>生活動線（スーパー・複合施設）</h4><span class="sq" style="background:${LIFELINE_COLOR}"></span>スーパー・複合施設<br>`;
      if (showNewOpen)
        h += `<h4>新規オープン予定</h4><span class="dot" style="background:${NEWOPEN_COLOR};border-color:${NEWOPEN_COLOR}"></span>出店予定店<br>`;
    }
    if (showWomenLifeline) {
      h += '<div class="sep"></div><h4>女性向け生活動線施設</h4>';
      h += `<span class="tri" style="border-bottom-color:${WOMEN_LIFELINE_COLOR}"></span>カーブス/LAVA/カルド/ユザワヤ/トーカイ<br>`;
    }
    if (showFav) {
      h += '<div class="sep"></div><h4>お気に入り地点</h4>';
      h += `<span style="color:${FAV_COLOR};font-size:15px;vertical-align:middle">★</span> メモ付き登録地点<br>`;
    }
    if (showRank1 || showRank2) {
      h += '<div class="sep"></div><h4>出店候補（エリアタイプ別 各上位3）</h4>';
      if (showRank1)
        h += `<span class="dot" style="background:${RANK1_COLOR};border-color:#fff;box-shadow:0 0 0 1px ${RANK1_COLOR}"></span>①スーパー近郊<br>`;
      if (showRank2)
        h += `<span class="dot" style="background:${RANK2_COLOR};border-color:#fff;box-shadow:0 0 0 1px ${RANK2_COLOR}"></span>②田舎ブルーオーシャン<br>`;
      h += `<span style="color:#777;font-size:10px">※番号は各エリアタイプ内の順位</span><br>`;
    }
    this._body.innerHTML = h;
  };
  legend.addTo(map);

  // ============================================================
  // データ & 状態
  // ============================================================
  let geoData = null;
  let choroplethLayer = null;
  let storeLayer, competitorLayer;
  let lifelineLayer = null, newOpeningLayer = null; // 生活動線 / 新規オープン予定
  let ranking1Layer = null, ranking2Layer = null;   // 出店候補ランキング①/②
  let womenLifelineLayer = null;                     // 機能2: 女性向け生活動線施設
  let layerControl = null;
  let choroplethMode = 'pop';   // 'pop' | 'none'

  // 機能1: 半径集計の状態
  let popPoints = null, popMeta = null;       // 人口メッシュ点群 [[lat,lng,w],...]
  let measureCircle = null, measureCenter = null;
  let MEASURE_RADIUS_KM = MEASURE_RADIUS_DEFAULT_KM;
  // 機能3: お気に入りの状態
  let favorites = [], favLayer = null, favMarkers = {};
  // クリック操作モード: 'none'(通常) | 'radius'(半径集計) | 'favorite'(お気に入り追加)
  let clickMode = 'none';

  // ============================================================
  // コロプレスのスタイル関数
  // ============================================================
  function choroplethStyle(feature) {
    const p = feature.properties;
    // 非表示時はフィルも枠線も完全に消す→店舗ピンが見やすくなる
    if (choroplethMode === 'none')
      return { fillOpacity: 0, opacity: 0, weight: 0 };
    // 人口ヒートマップ（色を薄めに: fillOpacity 0.45、枠線も淡く）
    const color = pickColor(POP_BREAKS, POP_PAL, p.women_40plus||0);
    return { fillColor: color, weight: 0.8, opacity: 0.5, color: '#bbb', fillOpacity: 0.45 };
  }

  function refreshChoropleth() {
    if (!choroplethLayer) return;
    choroplethLayer.setStyle(choroplethStyle);
    refreshLegend();
  }

  // ============================================================
  // 凡例更新
  // ============================================================
  function refreshLegend() {
    legend.update(
      choroplethMode,
      competitorLayer && map.hasLayer(competitorLayer),
      lifelineLayer && map.hasLayer(lifelineLayer),
      newOpeningLayer && map.hasLayer(newOpeningLayer),
      ranking1Layer && map.hasLayer(ranking1Layer),
      ranking2Layer && map.hasLayer(ranking2Layer),
      womenLifelineLayer && map.hasLayer(womenLifelineLayer),
      favLayer && map.hasLayer(favLayer),
    );
  }

  // ============================================================
  // 機能1: クリック地点 半径n km圏内 人口集計（指標=40歳以上女性人口）
  // ============================================================
  // 円内集計: 人口メッシュ(町丁字centroid)を点として半径内に入るか判定する近似。
  function sumPopWithinRadius(lat, lng, radiusKm) {
    if (!popPoints) return null;
    let sum = 0;
    for (let i = 0; i < popPoints.length; i++) {
      const p = popPoints[i];
      if (haversineKm(lat, lng, p[0], p[1]) <= radiusKm) sum += p[2];
    }
    return sum;
  }

  function drawMeasureCircle() {
    if (!measureCenter) return;
    if (measureCircle) map.removeLayer(measureCircle);
    measureCircle = L.circle(measureCenter, {
      pane: 'measure',
      radius: MEASURE_RADIUS_KM * 1000,
      color: MEASURE_CIRCLE_COLOR, weight: 2, opacity: 0.9,
      fillColor: MEASURE_CIRCLE_COLOR, fillOpacity: 0.12,
      interactive: false,   // 円をクリックしても下のクリックを妨げない
    }).addTo(map);
  }

  function updateMeasureResult() {
    const el = document.getElementById('measure-result');
    if (!el) return;
    if (!measureCenter) {
      el.innerHTML = '地図をクリックして中心を指定';
      return;
    }
    if (!popPoints) { el.innerHTML = '人口メッシュ読込中…'; return; }
    const sum = sumPopWithinRadius(measureCenter.lat, measureCenter.lng, MEASURE_RADIUS_KM);
    el.innerHTML =
      `半径${MEASURE_RADIUS_KM.toFixed(1)}km圏内の${popMeta ? popMeta.label : '40歳以上女性人口'}: `
      + `<b>約${fmtN(sum)}人</b>`
      + `<br><span style="color:#888;font-size:10px">※${popMeta ? popMeta.granularity : '小地域centroid'}の合計による近似値</span>`;
  }

  function runMeasure(latlng) {
    measureCenter = latlng;
    drawMeasureCircle();
    updateMeasureResult();
  }

  function clearMeasure() {
    if (measureCircle) { map.removeLayer(measureCircle); measureCircle = null; }
    measureCenter = null;
    updateMeasureResult();
  }

  // ============================================================
  // 機能3: お気に入り地点（localStorage 保存 + コメント）
  // ============================================================
  function loadFavorites() {
    try {
      const raw = localStorage.getItem(FAV_STORAGE_KEY);
      favorites = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(favorites)) favorites = [];
    } catch (e) { favorites = []; }
  }
  function saveFavorites() {
    try { localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favorites)); }
    catch (e) { console.error('お気に入り保存失敗', e); }
  }
  function genFavId() {
    return 'f' + Date.now().toString(36) + Math.floor(Math.random() * 1e5).toString(36);
  }

  function favIcon() {
    return L.divIcon({
      className: 'fav-pin-wrap',
      html: '<div class="fav-pin">★</div>',
      iconSize: [28, 28], iconAnchor: [14, 26], popupAnchor: [0, -24],
    });
  }

  function favPopupHtml(f) {
    let h = `<div style="font-size:12px;min-width:200px">`;
    h += `<div style="font-weight:bold;color:${FAV_COLOR}">★ お気に入り地点</div>`;
    h += `<textarea id="fav-ta-${f.id}" rows="3" `
       + `style="width:100%;margin:5px 0;font-size:12px;box-sizing:border-box" `
       + `placeholder="コメント（例: コープ+カーブス併設、競合1.6km、駐車場要確認）">`
       + `${escapeHtml(f.comment)}</textarea>`;
    h += `<div style="display:flex;gap:6px">`
       + `<button onclick="favSaveFromPopup('${f.id}')" class="tp-btn" style="background:${FAV_COLOR}">保存</button>`
       + `<button onclick="favDeleteFromPopup('${f.id}')" class="tp-btn" style="background:#b91c1c">削除</button>`
       + `</div>`;
    h += `<div style="color:#888;font-size:10px;margin-top:4px">${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}</div>`;
    h += mapsLinks(f.lat, f.lng);
    h += `</div>`;
    return h;
  }

  function renderFavorites() {
    if (!favLayer) return;
    favLayer.clearLayers();
    favMarkers = {};
    favorites.forEach(f => {
      const m = L.marker([f.lat, f.lng], { icon: favIcon(), pane: 'favorites', zIndexOffset: 3000 })
        .bindPopup(favPopupHtml(f));
      m.addTo(favLayer);
      favMarkers[f.id] = m;
    });
    renderFavList();
    refreshLegend();
  }

  function renderFavList() {
    const el = document.getElementById('fav-list');
    const cnt = document.getElementById('fav-count');
    if (cnt) cnt.textContent = favorites.length;
    if (!el) return;
    if (!favorites.length) { el.innerHTML = '<span style="color:#999">登録なし</span>'; return; }
    el.innerHTML = favorites.map(f => {
      const txt = f.comment ? escapeHtml(f.comment) : '<span style="color:#999">(コメントなし)</span>';
      return `<div class="fav-item" data-id="${f.id}"><span class="fav-star">★</span>`
           + `<span class="fav-text">${txt}</span></div>`;
    }).join('');
    el.querySelectorAll('.fav-item').forEach(div => {
      div.addEventListener('click', () => {
        const f = favorites.find(x => x.id === div.dataset.id);
        if (!f) return;
        map.flyTo([f.lat, f.lng], Math.max(map.getZoom(), 14));
        const m = favMarkers[f.id];
        if (m) m.openPopup();
      });
    });
  }

  function addFavorite(lat, lng, comment) {
    const f = { id: genFavId(), lat: +lat, lng: +lng, comment: comment || '',
                createdAt: new Date().toISOString() };
    favorites.push(f);
    saveFavorites();
    renderFavorites();
    return f;
  }
  function updateFavorite(id, comment) {
    const f = favorites.find(x => x.id === id);
    if (!f) return;
    f.comment = comment;
    saveFavorites();
    renderFavorites();
  }
  function deleteFavorite(id) {
    favorites = favorites.filter(x => x.id !== id);
    saveFavorites();
    renderFavorites();
  }

  // ポップアップ内のボタンから呼ぶグローバル関数
  window.favSaveFromPopup = function(id) {
    const ta = document.getElementById('fav-ta-' + id);
    if (ta) updateFavorite(id, ta.value);
    map.closePopup();
  };
  window.favDeleteFromPopup = function(id) { deleteFavorite(id); map.closePopup(); };
  // 既存候補地点の「お気に入り登録」ボタンから
  window.favAddFromPoint = function(lat, lng) {
    map.closePopup();
    const f = addFavorite(lat, lng, '');
    const m = favMarkers[f.id];
    if (m) m.openPopup();
  };

  // ============================================================
  // クリック操作モード切替 + 地図クリックの振り分け
  // ============================================================
  function setClickMode(mode) {
    clickMode = mode;
    map.getContainer().style.cursor = (mode === 'none') ? '' : 'crosshair';
    // 半径集計モードを抜けたら円は残さない（残った円が操作の邪魔になるため）
    if (mode !== 'radius') clearMeasure();
    const hint = document.getElementById('mode-hint');
    if (hint) {
      hint.textContent =
        mode === 'radius'   ? '地図クリックで円の中心を指定' :
        mode === 'favorite' ? '地図クリックでお気に入り追加' :
        '通常モード（ピン/市区町村を操作）';
    }
  }

  // 半径集計/お気に入り追加モードのクリック処理。処理したら true を返す。
  // ※ map.on('click') と、Canvasコロプレスのポリゴンclick の両方から呼ぶ。
  //    （Canvasレンダラーはポリゴン上のクリックで map の click を fakeStop するため、
  //      ポリゴン側ハンドラからも明示的に呼ばないと半径集計が発火しない）
  function handleModeClick(latlng) {
    if (clickMode === 'radius') {
      runMeasure(latlng);
      return true;
    }
    if (clickMode === 'favorite') {
      const f = addFavorite(latlng.lat, latlng.lng, '');
      const m = favMarkers[f.id];
      if (m) m.openPopup();
      return true;
    }
    return false;
  }

  map.on('click', e => { handleModeClick(e.latlng); });

  // ============================================================
  // ツールパネル（機能1: 半径集計 / 機能3: お気に入り）
  // ============================================================
  const toolPanel = L.control({ position: 'bottomleft' });
  toolPanel.onAdd = function() {
    const div = L.DomUtil.create('div', 'toolpanel');
    div.innerHTML =
        '<div class="toolpanel-header"><span>🛠 商圏ツール</span><span class="tp-toggle">▼</span></div>'
      + '<div class="toolpanel-body">'
      +   '<div class="tp-modes">'
      +     '<label><input type="radio" name="clickmode" value="none" checked> 通常（操作）</label>'
      +     '<label><input type="radio" name="clickmode" value="radius"> 半径集計</label>'
      +     '<label><input type="radio" name="clickmode" value="favorite"> お気に入り追加</label>'
      +   '</div>'
      +   '<div id="mode-hint" style="color:#888;font-size:10px;margin:2px 0 4px">通常モード（ピン/市区町村を操作）</div>'
      +   '<div class="sep"></div>'
      +   '<h4>📏 半径集計（40歳以上女性人口）</h4>'
      +   '<div class="tp-row"><span>半径</span>'
      +     `<input type="range" id="measure-radius" min="${MEASURE_RADIUS_MIN_KM}" max="${MEASURE_RADIUS_MAX_KM}" step="${MEASURE_RADIUS_STEP_KM}" value="${MEASURE_RADIUS_KM}">`
      +     '<span id="measure-radius-val" style="white-space:nowrap"></span></div>'
      +   '<div id="measure-result">地図をクリックして中心を指定</div>'
      +   '<button id="measure-clear" class="tp-btn" style="background:#64748b">クリア</button>'
      +   '<div class="sep"></div>'
      +   '<h4>★ お気に入り (<span id="fav-count">0</span>)</h4>'
      +   '<div id="fav-list"><span style="color:#999">登録なし</span></div>'
      + '</div>';

    // パネル操作で地図がドラッグ/ズームされないように
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);

    // 折りたたみ
    const tog = div.querySelector('.tp-toggle');
    const hdr = div.querySelector('.toolpanel-header');
    L.DomEvent.on(hdr, 'click', () => {
      const collapsed = div.classList.toggle('collapsed');
      tog.textContent = collapsed ? '▶' : '▼';
    });
    if (window.innerWidth < 768) { div.classList.add('collapsed'); tog.textContent = '▶'; }
    return div;
  };
  toolPanel.addTo(map);

  // ツールパネルのイベント配線（コントロール追加後にDOMが存在）
  (function wireToolPanel() {
    const radios = document.querySelectorAll('input[name="clickmode"]');
    radios.forEach(r => r.addEventListener('change', e => { if (e.target.checked) setClickMode(e.target.value); }));

    const slider = document.getElementById('measure-radius');
    const sval   = document.getElementById('measure-radius-val');
    const setVal = () => { sval.textContent = (+slider.value).toFixed(1) + 'km'; };
    setVal();
    slider.addEventListener('input', () => {
      MEASURE_RADIUS_KM = +slider.value;
      setVal();
      if (measureCenter) { drawMeasureCircle(); updateMeasureResult(); }  // 即時再計算
    });
    document.getElementById('measure-clear').addEventListener('click', clearMeasure);
  })();

  // お気に入りレイヤーを作成（トグル可能・最前面ペイン）し、保存済みを描画
  loadFavorites();
  favLayer = L.layerGroup([]).addTo(map);
  renderFavorites();

  // ============================================================
  // Phase 1: 人口コロプレス + 店舗ピン（即表示）
  // ============================================================
  async function phase1() {
    document.getElementById('loading-sub').textContent = '基本データ取得中…';
    const [geo, stores] = await Promise.all([
      fetch('data/ward_population.geojson').then(r=>r.json()),
      fetch('data/stores.json').then(r=>r.json()),
    ]);
    geoData = geo;

    // ---- コロプレス（1レイヤー・動的スタイル）----
    choroplethLayer = L.geoJSON(geoData, {
      style: choroplethStyle,
      onEachFeature: (feature, layer) => {
        layer.on({
          mouseover(e) {
            // ハイライトは「濃く塗る」のではなく「太い枠線＋やや薄いフィル」で示す
            // （従来は fillOpacity 0.85 で暗くなりピンが見えにくかった）
            if (choroplethMode !== 'none') {
              e.target.setStyle({ weight:3, color:'#333', fillOpacity:0.3 });
              e.target.bringToFront();
            }
            info.show(feature.properties);
          },
          mouseout(e) {
            choroplethLayer.resetStyle(e.target);
            info.clear();
          },
          click(e) {
            // Canvasコロプレスはポリゴン上のクリックで map の click を止めるため、
            // 半径集計/お気に入りモードはここで明示的に処理する。
            if (handleModeClick(e.latlng)) return;
            // 通常モードのみ市区町村ズーム
            map.fitBounds(e.target.getBounds(), { padding:[40,40] });
          },
        });
        const p = feature.properties;
        const tp=p.total_pop||0, wp=p.women_40plus||0, pct=tp>0?(wp/tp*100).toFixed(1):'—';
        layer.bindPopup(`<b>${p.city}</b><br>総人口: ${fmtN(tp)} 人<br>女性40+: <b>${fmtN(wp)}</b> 人 (${pct}%)`);
      },
    }).addTo(map);

    // ---- 買取大吉店舗ピン ----
    const markers = [];
    stores.forEach(s => {
      if (!s.lat||!s.lng) return;
      const col = PREF_COLORS[s.prefecture]||'#888';
      markers.push(
        L.circleMarker([s.lat,s.lng], {
          pane:'stores', renderer:storeRenderer,
          radius:5, fillColor:col, color:'#fff', weight:1.5, fillOpacity:0.9,
        }).bindPopup(`<b>${s.name}</b><br><span style="color:#555">${s.prefecture}</span><br>${s.address}${mapsLinks(s.lat,s.lng)}${favLinkHtml(s.lat,s.lng)}`)
      );
    });
    storeLayer = L.layerGroup(markers).addTo(map);

    // ---- レイヤーコントロール（初期 = 最低限のレイヤーのみ）----
    // 小画面(幅768px未満)では折りたたみ表示（アイコンをタップで展開）
    layerControl = L.control.layers(
      {},
      { '📍 買取大吉 店舗': storeLayer },
      { collapsed: window.innerWidth < 768, position: 'topleft' }
    ).addTo(map);

    // 機能3: お気に入りレイヤーをトグル対象に追加
    layerControl.addOverlay(favLayer, `<span style="color:${FAV_COLOR}">★</span> お気に入り地点`);

    // ---- コロプレス切替セレクタのイベント ----
    document.getElementById('choropleth-select').addEventListener('change', e => {
      choroplethMode = e.target.value;
      refreshChoropleth();
    });

    refreshLegend();
    document.getElementById('loading').style.display = 'none';
  }

  // ============================================================
  // Phase 2: 競合店・生活動線・新規オープン予定（バックグラウンド）
  // ============================================================
  async function phase2() {
    const bgEl = document.getElementById('bg-status');
    bgEl.textContent = '追加データ読み込み中…'; bgEl.style.display = 'block';
    try {
      // 店舗データ（並行取得）
      const [comp, lifeline, newOpen, rank1, rank2, popPts, womenLL] = await Promise.all([
        fetch('data/competitors_all.json').then(r=>r.json()),
        fetch('data/lifeline_stores.json').then(r=>r.json()),
        fetch('data/new_openings.json').then(r=>r.json()),
        fetch('data/ranking_strategy1.json').then(r=>r.json()),
        fetch('data/ranking_strategy2.json').then(r=>r.json()),
        fetch('data/pop_points.json').then(r=>r.json()),            // 機能1: 人口メッシュ点群
        fetch('data/women_lifeline_stores.json').then(r=>r.json()), // 機能2: 女性向け生活動線
      ]);

      // ---- 機能1: 人口メッシュ点群をセット（半径集計が使えるように）----
      popMeta = { label: popPts.label, granularity: popPts.granularity, source: popPts.source };
      popPoints = popPts.points;
      updateMeasureResult();  // 「読込中」表示を更新

      // ---- 競合店マーカー ----
      const compMarkers = [];
      comp.forEach(s => {
        if (!s.latitude||!s.longitude) return;
        const col = BRAND_COLORS[s.brand]||'#888';
        compMarkers.push(
          L.circleMarker([s.latitude,s.longitude], {
            pane: 'stores', renderer: storeRenderer, // 常にコロプレスより前面＆イベント受取
            radius:4, fillColor:'#222', color:'#888', weight:0.8, fillOpacity:0.85,
          }).bindPopup(`<b>${s.name}</b><br><span style="color:${col};font-weight:bold">${s.brand}</span><br>${s.prefecture}${s.address?'<br>'+s.address:''}${mapsLinks(s.latitude,s.longitude)}`)
        );
      });
      competitorLayer = L.layerGroup(compMarkers);

      // ---- 生活動線（スーパー・複合施設）#DB2777 半透明・一回り小さめ ----
      // storesペイン(zIndex650)+SVGレンダラーで人口色塗りより必ず上＆空白透過
      const llMarkers = [];
      lifeline.forEach(s => {
        if (!s.lat||!s.lng) return;
        llMarkers.push(
          L.marker([s.lat,s.lng], {
            pane:'stores', icon: sqIcon(LIFELINE_COLOR, 10), opacity: 0.9,
          }).bindTooltip(`${s.name}<br><span style="color:#555">${s.category}・${s.chain}</span>`,{sticky:true})
           .bindPopup(`<b>${s.name}</b><br><span style="color:#555">${s.category}・${s.chain}</span>${mapsLinks(s.lat,s.lng)}${favLinkHtml(s.lat,s.lng)}`)
        );
      });
      lifelineLayer = L.layerGroup(llMarkers);

      // ---- 機能2: 女性向け生活動線施設（カーブス/LAVA/カルド/ユザワヤ/トーカイ）#0891B2 ----
      // storesペイン(z650)+SVGレンダラーで人口色塗りより前面＆空白透過。1色でまとめる。
      const wlMarkers = [];
      womenLL.forEach(s => {
        if (!s.lat || !s.lng) return;
        wlMarkers.push(
          L.marker([s.lat, s.lng], {
            pane:'stores', icon: triIcon(WOMEN_LIFELINE_COLOR, 15),
          }).bindTooltip(`${s.name}<br><span style="color:#555">女性向け生活動線・${s.chain}</span>`,{sticky:true})
           .bindPopup(`<b>${s.name}</b><br><span style="color:${WOMEN_LIFELINE_COLOR};font-weight:bold">女性向け生活動線施設</span>・${s.chain}<br>${s.prefecture}${mapsLinks(s.lat,s.lng)}${favLinkHtml(s.lat,s.lng)}`)
        );
      });
      womenLifelineLayer = L.layerGroup(wlMarkers);

      // ---- 新規オープン予定 #D4A017 ----
      const noMarkers = [];
      newOpen.forEach(s => {
        if (!s.lat||!s.lng) return;
        noMarkers.push(
          L.circleMarker([s.lat,s.lng], {
            pane:'stores', renderer:storeRenderer,
            radius:5, fillColor:NEWOPEN_COLOR, color:'#7a5c00', weight:1.2, fillOpacity:0.9,
          }).bindTooltip(`<b>${s.name}</b><br><span style="color:#555">${s.category}・${s.chain}</span><br>オープン: ${s.opening||'時期未定'}`,{sticky:true})
           .bindPopup(`<b>${s.name}</b><br><span style="color:#555">${s.category}・${s.chain}</span><br>オープン: ${s.opening||'時期未定'}${mapsLinks(s.lat,s.lng)}`)
        );
      });
      newOpeningLayer = L.layerGroup(noMarkers);

      // ---- 出店候補ランキング①/②（番号入り大型ピン・rankingペインz700で最前面）----
      function buildRanking(arr, color, strat) {
        const markers = [];
        arr.forEach(r => {
          if (!r.lat || !r.lng) return;
          markers.push(
            L.marker([r.lat, r.lng], { icon: rankIcon(r.rank, color), pane: 'ranking',
                                       zIndexOffset: 1000 + (50 - r.rank) })
              .bindTooltip(`[${r.area_type}] 第${r.rank}位 ${r.name}（${r.prefecture}${r.city}）総合${r.total_score}`,
                           { direction: 'top', offset: [0, -16] })
              .bindPopup(rankPopup(r, strat), { maxWidth: 280 })
          );
        });
        return L.layerGroup(markers);
      }
      ranking1Layer = buildRanking(rank1, RANK1_COLOR, 1).addTo(map);
      ranking2Layer = buildRanking(rank2, RANK2_COLOR, 2).addTo(map);

      // レイヤーコントロールに追加
      layerControl.addOverlay(competitorLayer, '<span style="color:#9b59b6">●</span> 競合3社（おたからや/バイセル/なんぼや）');
      layerControl.addOverlay(lifelineLayer,   `<span style="color:${LIFELINE_COLOR}">■</span> 生活動線（スーパー・複合施設）`);
      layerControl.addOverlay(womenLifelineLayer, `<span style="color:${WOMEN_LIFELINE_COLOR}">▲</span> 女性向け生活動線施設（カーブス/LAVA/カルド/ユザワヤ/トーカイ）`);
      layerControl.addOverlay(newOpeningLayer, `<span style="color:${NEWOPEN_COLOR}">●</span> 新規オープン予定`);
      layerControl.addOverlay(ranking1Layer,   `<span style="color:${RANK1_COLOR};font-weight:bold">①</span> 出店候補①（スーパー近郊・エリア別）`);
      layerControl.addOverlay(ranking2Layer,   `<span style="color:${RANK2_COLOR};font-weight:bold">②</span> 出店候補②（田舎ブルーオーシャン・エリア別）`);

      map.on('overlayadd overlayremove', refreshLegend);

      bgEl.style.display = 'none';
    } catch(err) {
      bgEl.textContent = '追加データ読込失敗: ' + err.message;
      console.error(err);
    }
  }

  // ============================================================
  // 起動
  // ============================================================
  phase1()
    .then(() => phase2())
    .catch(err => {
      document.getElementById('loading').textContent = '読み込み失敗: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
