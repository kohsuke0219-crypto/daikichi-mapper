name: Update Daikichi Stores

on:
  # 毎週月曜の朝 6:00 JST (= 日曜 21:00 UTC) に実行
  schedule:
    - cron: "0 21 * * 0"
  # 手動実行も可能にしておく
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PREFECTURE: "東京都,神奈川県,埼玉県,千葉県"
        run: |
          python -m scraper.main --spreadsheet-id "$SPREADSHEET_ID" --prefecture "$PREFECTURE"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::スクレイパーが失敗しました。サイト構造が変わった可能性があります。"
